name: Build & Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: app
    shell: bash

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 -m unittest discover -s ../.github/scripts -p 'test_*.py'
          python3 ../.github/scripts/release_version.py "$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test English map labels
        run: node --test src/test/js/labels.test.mjs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install stable signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Set repository secret DEBUG_KEYSTORE_BASE64 first. See README.md."
            exit 1
          fi
          KEYSTORE="${RUNNER_TEMP}/flippin.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey > /dev/null
          echo "FLIPPIN_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Test, lint and build release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :testDebugUnitTest :lintRelease :assembleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Verify signature and stage APK
        id: stage
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          SRC="build/outputs/apk/release/FlipPin-release.apk"
          test -s "$SRC"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          SIGNERS=$("$APKSIGNER" verify --print-certs "$SRC")
          APK_CERTS=$(printf '%s\n' "$SIGNERS" | grep 'certificate SHA-256 digest:' | awk '{print $NF}' | sort -u)
          KEYSTORE_CERT=$(keytool -exportcert -keystore "$FLIPPIN_KEYSTORE" \
            -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          if [ "$APK_CERTS" != "$KEYSTORE_CERT" ]; then
            echo "::error::APK signer does not match the permanent signing keystore."
            exit 1
          fi
          mkdir -p dist
          APK="dist/FlipPin-${VERSION_NAME}.apk"
          cp "$SRC" "$APK"
          (cd dist && sha256sum "FlipPin-${VERSION_NAME}.apk" > "FlipPin-${VERSION_NAME}.apk.sha256")
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Attach APK and checksum to published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          APK: ${{ steps.stage.outputs.apk }}
        run: gh release upload "$TAG" "$APK" "${APK}.sha256" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove signing keystore from runner
        if: always()
        run: rm -f "${RUNNER_TEMP}/flippin.keystore"
